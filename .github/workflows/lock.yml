name: lock pull-request
on:
    pull_request:
        types:
            - closed

permissions: {}

jobs:
    lock:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: lock pull request
              uses: sudo-bot/action-pull-request-lock@8d1ae2b00cc4bf943144f4706048d7e75f038c3c # v1.1.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ github.event.pull_request.number }}
                  lock-reason: resolved
