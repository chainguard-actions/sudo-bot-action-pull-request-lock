name: lock pull-request
on:
    pull_request:
        types:
            - closed

permissions: {}

jobs:
    lock:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: lock pull request
              uses: sudo-bot/action-pull-request-lock@dfbd97e4189a02e99efc42786c64c8efab8ac0c5 # v1.0.4
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ github.event.pull_request.number }}
                  lock-reason: resolved
