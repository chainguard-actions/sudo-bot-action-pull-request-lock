name: Test PR lock with default lock reason (resolved)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: "999999"
          # lock-reason is intentionally omitted to test the default value of "resolved"

      - name: Assert action ran with default lock reason
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with a GitHub API error (e.g. 404).
          # It must not be 'skipped' — that would mean the step never ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with default lock-reason=resolved (outcome=$OUTCOME)"
