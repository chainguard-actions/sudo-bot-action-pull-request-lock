name: Test lock pull-request - default lock reason
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with default lock-reason (resolved)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "999999999"
      - name: Assert action attempted to lock (failed due to non-existent PR, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because PR 999999999 does not exist,
          # not because of missing or invalid inputs (default lock-reason is 'resolved').
          # A failure here means the action reached the API call stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted to lock with default lock-reason and failed on API call"
