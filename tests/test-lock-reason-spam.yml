name: Test lock reason spam
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          number: "7"
          lock-reason: spam
      - name: Assert action ran and failed gracefully with API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is fake and the API call will fail
          # but it should NOT fail due to invalid lock-reason value
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with API error, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with lock-reason=spam"
