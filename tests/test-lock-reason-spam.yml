name: Test lock-reason spam
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to lock a non-existent PR with spam reason
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          number: "999998"
          lock-reason: "spam"
        continue-on-error: true

      - name: Assert action ran with spam lock-reason
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because PR 999998 does not exist,
          # but it should not crash due to an invalid lock-reason input.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected for non-existent PR"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (PR may exist in this repo)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
