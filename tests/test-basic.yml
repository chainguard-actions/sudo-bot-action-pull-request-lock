name: Test basic usage - lock PR with default reason
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: "fake-token-for-testing"
          number: "1"
          lock-reason: "resolved"
      - name: Assert action ran and failed gracefully (expected with fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (no real GitHub API)
          # but it should fail gracefully via core.setFailed, not crash
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with invalid token"
