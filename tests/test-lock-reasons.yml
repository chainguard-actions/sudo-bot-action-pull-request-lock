name: Test lock pull-request - various lock reasons
on:
  workflow_dispatch:
jobs:
  test-off-topic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with off-topic lock reason
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          lock-reason: "off-topic"
      - name: Assert action attempted API call with off-topic reason
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted lock with off-topic reason"

  test-too-heated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with too-heated lock reason
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          lock-reason: "too heated"
      - name: Assert action attempted API call with too-heated reason
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted lock with too-heated reason"

  test-spam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with spam lock reason
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          lock-reason: "spam"
      - name: Assert action attempted API call with spam reason
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted lock with spam reason"
