name: Test lock-reason off-topic input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with off-topic lock reason on non-existent PR (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          lock-reason: "off-topic"

      - name: Assert action failed with API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR with off-topic reason, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent PR with off-topic lock reason"
