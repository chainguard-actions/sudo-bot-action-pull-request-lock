name: Test lock pull-request - invalid PR number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-existent PR number (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          lock-reason: "resolved"
      - name: Assert action failed for non-existent PR
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent PR"
